DKPS|Sumber daya manusia|Tabel 3. Profil dosen berdasarkan kontribusi intelektual (3a pendidikan dan pengajaran, 3b penelitian dan PkM)
DKPS|Sumber daya manusia|Tabel 4. Ekuivalensi waktu mengajar penuh (EWMP)

DKPS|Luaran|Tabel 8. Luaran penelitian dan PkM yang dihasilkan dosen`
.split("\n").map((l,i)=>{
const p=l.split("|");
return{i,g:p[0],d:p[1],t:p[2]}
});

const kS=x=>(st.k["k"+x.i]||{}).s||"Belum Mulai";

function exportXl(){
if(!window.XLSX||!DL)return toast("Ekspor belum tersedia di tampilan ini.");
const wb=XLSX.utils.book_new();

const act=A.map(a=>{
const d=st.a["a"+a.i]||{};
return{
No:a.i+1,
Fasilitas:FAS[a.f],
Kegiatan:a.t,
Output:a.o,
Fase:a.ph?"Operasional":"Pelaksanaan",
"Minggu mulai":a.s,
"Minggu selesai":a.e,
"Tanggal mulai":fmt(ws(a.s)),
"Tanggal selesai":fmt(we(a.e)),
Status:sOf(a),
PIC:d.pic||"",
Catatan:d.note||""
}
});

const kr=KI.map(x=>{
const d=st.k["k"+x.i]||{},o=st.k["own_"+x.g]||{};
return{
Bagian:KG[x.g],
Dimensi:x.d,
Butir:x.t,
Status:kS(x),
PIC:d.pic||"",
"Penanggung jawab":o.pic||"",
"Tautan":d.link||""
}
});

const bk=CK.map(x=>{
const d=st.c["c"+x.i]||{};
return{
Fasilitas:x.f,
Bukti:x.b,
Ada:d.ok?"Ya":"Belum",
Tautan:d.link||""
}
});

[["Kegiatan",act],["Kriteria",kr],["Bukti Fasilitas",bk]].forEach(([n,r])=>
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));

const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
DL.save({filename:"progres-akreditasi.xlsx",data:out})
.then(()=>toast("File Excel disimpan."),e=>{
if(!e||e.code!=="declined")toast("Gagal mengunduh file.")
});
}

function vButir(gs){
let h="";
gs.forEach(g=>{
const l=KI.filter(x=>x.g===g),c=l.filter(x=>kS(x)==="Selesai").length;

h+=`<h2 style="margin-top:26px">${KG[g]}</h2>
<div class="tools" style="align-items:center">
<label for="own${g}" class="pill">Penanggung jawab:</label>
<input type="text" id="own${g}" data-q="own_${g}" data-f="pic" placeholder="Nama koordinator" value="${esc((st.k["own_"+g]||{}).pic)}">
</div>
<div class="fr" style="grid-template-columns:1fr 56px">
${seg([[c,SC.Selesai]],l.length)}
<em>${c}/${l.length}</em>
</div>`;

if(g==="K3"){
const f=A.filter(a=>a.f>=1&&a.f<=5);
h+=`<p class="sub" style="margin:0 0 8px">
Fasilitas pendukung (Tax Center, Galeri Investasi, Lab Audit, Lab Komputer, Ruang Konseling):
${f.filter(a=>sOf(a)==="Selesai").length} dari ${f.length} kegiatan selesai.
Rinciannya ada di tab Jadwal dan Kegiatan.
</p>`
}

h+=`<div class="tbl"><table>
<thead><tr>
<th>Butir bukti</th><th>Status</th><th>PIC</th><th>Tautan atau lokasi arsip</th>
</tr></thead><tbody>`;

let pd="";
l.forEach(x=>{
if(x.d!==pd){
h+=`<tr class="fh"><td colspan="4">${esc(x.d)}</td></tr>`;
pd=x.d
}
const d=st.k["k"+x.i]||{},s=kS(x);

h+=`<tr>
<td>${esc(x.t)}</td>
<td><select class="s-${s.replace(" ","")}" data-q="k${x.i}" data-f="s" aria-label="Status">
${STS.map(y=>`<option${y===s?" selected":""}>${y}</option>`).join("")}
</select></td>
<td><input type="text" data-q="k${x.i}" data-f="pic" value="${esc(d.pic)}" aria-label="PIC"></td>
<td><input type="text" data-q="k${x.i}" data-f="link" value="${esc(d.link)}" aria-label="Tautan"></td>
</tr>`
});

h+=`</tbody></table></div>`
});
return h

const TABS=[
["ringkasan","Ringkasan"],
["jadwal","Jadwal Gantt"],
["kegiatan","Kegiatan"],
["kriteria","Kriteria"],
["dokumen","DED dan DKPS"],
["bukti","Bukti Fasilitas"],
["catatan","Catatan"]
];

let DL=null;
let st={start:"2026-11-02",a:{},c:{},k:{}};
let DB=null,tab="ringkasan",fF="",fS="";

try{
const l=JSON.parse(localStorage.getItem("akr")||"null");
if(l)st=Object.assign(st,l)
}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
}[c]));

const base=()=>{
const[y,m,d]=st.start.split("-").map(Number);
return Date.UTC(y,m-1,d)
};

const T0=()=>{
const t=new Date();
return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())
};

const ws=w=>base()+(w-1)*7*MS;
const we=w=>base()+w*7*MS-3*MS;

const fmt=ms=>{
const d=new Date(ms);
return d.getUTCDate()+" "+BL[d.getUTCMonth()]+" "+d.getUTCFullYear()
};

const fs=ms=>{
const d=new Date(ms);
return d.getUTCDate()+" "+BL[d.getUTCMonth()]
};

const sOf=a=>(st.a["a"+a.i]||{}).s||"Belum Mulai";
const late=a=>we(a.e)<T0()&&sOf(a)!=="Selesai";
const wkNow=()=>Math.floor((T0()-base())/(7*MS))+1;

function toast(m){
const t=$("#toast");
t.textContent=m;
t.style.display="block";
clearTimeout(toast.h);
toast.h=setTimeout(()=>t.style.display="none",3500)
}

function save(kind,id,patch){
st[kind][id]=Object.assign({},st[kind][id],patch);

if(DB)
DB.doc(({a:"act/",c:"chk/",k:"krit/"})[kind]+id)
.set(st[kind][id])
.catch(()=>toast("Gagal menyimpan: akun ini mungkin hanya punya akses lihat."));
else try{
localStorage.setItem("akr",JSON.stringify(st))
}catch(e){}

render()
}

function setStart(v){
const d=new Date(v+"T00:00:00Z");
if(isNaN(d))return;
d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);
st.start=d.toISOString().slice(0,10);

if(DB)
DB.doc("cfg/main").set({start:st.start})
.catch(()=>toast("Gagal menyimpan tanggal mulai."));
else try{
localStorage.setItem("akr",JSON.stringify(st))
}catch(e){}

render()
}

const seg=(arr,tot)=>`<div class="seg">
${arr.map(([n,c])=>`<i style="width:${tot?n/tot*100:0}%;background:${c}"></i>`).join("")}
</div>`;

const cnt=list=>{
const r={};
STS.forEach(s=>r[s]=0);
list.forEach(a=>r[sOf(a)]++);
return r
};

function vRingkasan(){
const c=cnt(A),n=A.length,w=wkNow(),inRange=w>=1&&w<=52;
const act=A.filter(a=>sOf(a)!=="Selesai"&&inRange&&a.s<=w&&a.e>=w);
const lt=A.filter(late);

let h=`<p class="hero">
<b>${c.Selesai} dari ${n}</b> kegiatan selesai, ${c.Berjalan} berjalan
${c.Terkendala?`, ${c.Terkendala} terkendala`:""}.
</p>
${seg([[c.Selesai,SC.Selesai],[c.Berjalan,SC.Berjalan],[c.Terkendala,SC.Terkendala]],n)}
<div class="leg">
${[["Selesai","var(--ok)"],["Berjalan","var(--run)"],["Terkendala","var(--bad)"],["Belum mulai","var(--soft)"]].map(([t,col])=>`<span style="--c:${col}">${t}</span>`).join("")}
</div>
<div class="cols"><div>`;

h+=`<h2>Progres per fasilitas</h2>`+
FAS.map((f,fi)=>{
const l=A.filter(a=>a.f===fi),k=cnt(l);
return`<div class="fr"><span>${esc(f)}</span>${seg([[k.Selesai,SC.Selesai],[k.Berjalan,SC.Berjalan],[k.Terkendala,SC.Terkendala]],l.length)}<em>${k.Selesai}/${l.length}</em></div>`
}).join("");

h+=`<h2 style="margin-top:28px">Kesiapan dokumen akreditasi</h2>`+
Object.keys(KG).map(g=>{
const l=KI.filter(x=>x.g===g),k={};
STS.forEach(s=>k[s]=0);
l.forEach(x=>k[kS(x)]++);
return`<div class="fr"><span>${esc(KG[g].replace(/^Kriteria (\d)\. /,"K$1 "))}</span>${seg([[k.Selesai,SC.Selesai],[k.Berjalan,SC.Berjalan],[k.Terkendala,SC.Terkendala]],l.length)}<em>${k.Selesai}/${l.length}</em></div>`
}).join("");

h+=`<h2 style="margin-top:28px">
${inRange?`Minggu ke-${w} (${fs(ws(w))} – ${fs(we(w))})`:"Di luar periode proyek"}
</h2>`;

h+=lt.length?
`<div class="item late">${lt.length} kegiatan melewati tanggal selesai</div>`+
lt.slice(0,6).map(a=>`<div class="item">${esc(a.t)}<small class="late">Seharusnya selesai ${fmt(we(a.e))} · ${esc(FAS[a.f])}</small></div>`).join("")
:"";

h+=act.length?
act.map(a=>`<div class="item">${esc(a.t)}<small>${esc(FAS[a.f])} · sampai ${fmt(we(a.e))} · ${sOf(a)}</small></div>`).join("")
:(inRange||lt.length?"":`<div class="item"><small>Proyek belum dimulai. Minggu 1 jatuh pada ${fmt(ws(1))}.</small></div>`);

if(inRange&&!act.length&&!lt.length)
h+=`<div class="item"><small>Tidak ada kegiatan aktif minggu ini.</small></div>`;

h+=`</div><div><h2>Milestone</h2><ul class="ms">`+
[...MSL].sort((x,y)=>A[x.a].e-A[y.a].e).map(m=>{
const a=A[m.a],d=sOf(a)==="Selesai",o=late(a);
return`<li class="${d?"d":o?"o":""}">${esc(m.n)}<small>${fmt(we(a.e))}${d?" · tercapai":o?" · terlewat":""}</small></li>`
}).join("")+
`</ul></div></div>`;

return h
}

function vJadwal(){
const tw=52*W;
let mo="",pm=-1;

for(let i=1;i<=52;i++){
const m=new Date(ws(i)+3*MS).getUTCMonth();
if(m!==pm){
mo+=`<span class="mo" style="left:${(i-1)*W}px">${BL[m]}</span>`;
pm=m
}
}

let h=`<div class="gwrap"><div class="gin">
<div class="gr h">
<div class="gl f">Minggu 1–52 (${fs(ws(1))} – ${fs(we(52))})</div>
<div class="gt">${mo}</div>
</div>`;

FAS.forEach((f,fi)=>{
const l=A.filter(a=>a.f===fi),s=Math.min(...l.map(a=>a.s)),e=Math.max(...l.map(a=>a.e));

h+=`<div class="gr">
<div class="gl f" title="${esc(f)}">${esc(f)}</div>
<div class="gt"><div class="bar sp" style="left:${(s-1)*W}px;width:${(e-s+1)*W}px"></div></div>
</div>`;

l.forEach(a=>{
const s2=sOf(a),col=s2==="Belum Mulai"?(a.ph?"var(--b1)":"var(--b0)"):SC[s2];

h+=`<div class="gr">
<div class="gl" title="${esc(a.t)}">${a.i+1}. ${esc(a.t)}</div>
<div class="gt">
<div class="bar" title="${esc(fs(ws(a.s))+" – "+fs(we(a.e))+" · "+s2)}" style="left:${(a.s-1)*W}px;width:${(a.e-a.s+1)*W}px;background:${col}"></div>
</div></div>`
})
});

const tp=(T0()-base())/(7*MS)*W;
if(tp>=0&&tp<=tw)
h+=`<div class="tl" style="left:${250+tp}px" title="Hari ini"></div>`;

return h+`</div></div>
<div class="leg">
<span style="--c:var(--b0)">Pelaksanaan (belum mulai)</span>
<span style="--c:var(--b1)">Operasional</span>
<span style="--c:var(--run)">Berjalan</span>
<span style="--c:var(--ok)">Selesai</span>
<span style="--c:var(--bad)">Terkendala</span>
<span style="--c:var(--today)">Hari ini</span>
</div>`
}

function vKegiatan(){
let h=`<div class="tools">
<select id="ff" aria-label="Filter fasilitas">
<option value="">Semua fasilitas</option>
${FAS.map((f,i)=>`<option value="${i}"${fF===""+i?" selected":""}>${esc(f)}</option>`).join("")}
</select>
<select id="fs" aria-label="Filter status">
<option value="">Semua status</option>
${STS.map(s=>`<option${fS===s?" selected":""}>${s}</option>`).join("")}
</select>
</div>
<div class="tbl"><table>
<thead><tr><th>No</th><th>Kegiatan dan output</th><th>Waktu</th><th>Status</th><th>PIC</th><th>Catatan</th></tr></thead><tbody>`;

let pf=-1;

A.filter(a=>(fF===""||a.f===+fF)&&(fS===""||sOf(a)===fS)).forEach(a=>{
if(a.f!==pf){
h+=`<tr class="fh"><td colspan="6">${esc(FAS[a.f])}</td></tr>`;
pf=a.f
}

const d=st.a["a"+a.i]||{},s=sOf(a);

h+=`<tr>
<td>${a.i+1}</td>
<td>${esc(a.t)}<small>Bukti: ${esc(a.o)}</small></td>
<td>${fs(ws(a.s))} – ${fs(we(a.e))}<small>Minggu ${a.s}–${a.e}${late(a)?` · <span class="late">terlambat</span>`:""}</small></td>
<td><select class="s-${s.replace(" ","")}" data-k="a${a.i}" data-f="s" aria-label="Status kegiatan ${a.i+1}">
${STS.map(x=>`<option${x===s?" selected":""}>${x}</option>`).join("")}
</select></td>
<td><input type="text" data-k="a${a.i}" data-f="pic" value="${esc(d.pic)}" aria-label="PIC kegiatan ${a.i+1}"></td>
<td><input type="text" data-k="a${a.i}" data-f="note" value="${esc(d.note)}" aria-label="Catatan kegiatan ${a.i+1}"></td>
</tr>`
});

return h+`</tbody></table></div>`
}

function vBukti(){
const ok=CK.filter(x=>(st.c["c"+x.i]||{}).ok).length;
let h=`<p class="hero"><b>${ok} dari ${CK.length}</b> bukti tersedia.</p>
${seg([[ok,"var(--ok)"]],CK.length)}
<div style="height:22px"></div>`,pf="";

CK.forEach(x=>{
const d=st.c["c"+x.i]||{};
if(x.f!==pf){
h+=`<h2 style="margin-top:20px">${esc(x.f)}</h2>`;
pf=x.f
}
h+=`<div class="chk${d.ok?" on":""}">
<input type="checkbox" data-c="c${x.i}" ${d.ok?"checked":""} aria-label="${esc(x.b)}">
<span>${esc(x.b)}</span>
<input type="text" data-c="c${x.i}" data-l="1" placeholder="Lokasi arsip atau tautan" value="${esc(d.link)}" aria-label="Tautan ${esc(x.b)}">
</div>`
});

return h
}

const vCatatan=()=>`<h2>Catatan penting</h2><ol class="n">${NOTES.map(n=>`<li>${esc(n)}</li>`).join("")}</ol>`;

function render(){
$("#nav").innerHTML=TABS.map(([k,l])=>
`<button data-t="${k}" ${k===tab?'aria-current="true"':""}>${l}</button>`
).join("");

$("#st").value=st.start;
$("#sync").textContent=DB?"Tersimpan dan dibagikan ke tim":"Mode lokal: tersimpan di peramban ini saja";

$("#app").innerHTML=({
ringkasan:vRingkasan,
jadwal:vJadwal,
kegiatan:vKegiatan,
bukti:vBukti,
kriteria:()=>vButir(["K1","K2","K3","K4","K5"]),
dokumen:()=>vButir(["DED","DKPS"]),
catatan:vCatatan
})[tab]()
}

document.addEventListener("click",e=>{
if(e.target.id==="xl")return exportXl();
const b=e.target.closest("[data-t]");
if(b){
tab=b.dataset.t;
location.hash=tab;
render()
}
});

document.addEventListener("change",e=>{
const t=e.target;
if(t.id==="st")return setStart(t.value);
if(t.id==="ff"){fF=t.value;return render()}
if(t.id==="fs"){fS=t.value;return render()}
if(t.dataset.k)save("a",t.dataset.k,{[t.dataset.f]:t.value});
else if(t.dataset.q)save("k",t.dataset.q,{[t.dataset.f]:t.value});
else if(t.dataset.c)save("c",t.dataset.c,t.dataset.l?{link:t.value}:{ok:t.checked})
});

addEventListener("hashchange",()=>{
const h=location.hash.slice(1);
if(TABS.some(t=>t[0]===h)){
tab=h;
render()
}
});

{
const h=location.hash.slice(1);
if(TABS.some(t=>t[0]===h))tab=h
}

render();

(async()=>{
try{
const c=window.claude;
if(!c)return;
const db=await c.use("db");
if(!db)return;
DB=db;

db.collection("act").onSnapshot(s=>{
st.a={};
s.docs.forEach(d=>st.a[d.id]=d.data());
render()
},()=>{});

db.collection("chk").onSnapshot(s=>{
st.c={};
s.docs.forEach(d=>st.c[d.id]=d.data());
render()
},()=>{});

db.collection("krit").onSnapshot(s=>{
st.k={};
s.docs.forEach(d=>st.k[d.id]=d.data());
render()
},()=>{});

db.doc("cfg/main").onSnapshot(s=>{
const d=s.data();
if(d&&d.start){
st.start=d.start;
render()
}
},()=>{});

render()
}catch(e){}
})();

(async()=>{
try{
const c=window.claude;
if(!c)return;
const d=await c.use("downloads");
if(!d)return;
DL=d;
$("#xl").hidden=false
}catch(e){}
})();
</script>
